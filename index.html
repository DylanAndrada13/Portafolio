  <body>
    <!-- Escena WebGL (fondo animado) -->
    <canvas id="scene" aria-hidden="true"></canvas>

    <!-- Capas de atmósfera en CSS por encima del canvas -->
    <div class="atmos" aria-hidden="true">
      <div class="atmos__scanlines"></div>
      <div class="atmos__vignette"></div>
    </div>

    <!-- Zonas interactivas de la habitación (marcadores en pantalla) -->

    <!-- Cortina negra de la intro -->
    <div class="curtain" aria-hidden="true"></div>

    <header class="hero">
      <p class="name" id="name" aria-label="Dylan, marketing &amp; web developer">
        <span class="name__letters" aria-hidden="true"></span><span class="name__cursor" aria-hidden="true"></span>
      </p>
      <div class="hero__rule" aria-hidden="true"></div>
      <p class="hero__tag"><span class="hero__role">marketing &amp; web developer</span></p>
    </header>
